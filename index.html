<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Proyecto Queso</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff;
    }
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: url('https://images.unsplash.com/photo-1604908812483-69474a4ef56e?auto=format&fit=crop&w=1950&q=80') center center / cover no-repeat;
      filter: brightness(0.8);
    }
    .chat-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px #fff;
    }
    .chat-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #ffffff;
      color: #000000;
    }
    .message {
      margin-bottom: 10px;
    }
    .user { font-weight: bold; color: #1a73e8; }
    .bot { font-weight: bold; color: #0b8043; }
    #inputForm {
      display: flex;
      gap: 10px;
    }
    #userInput {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="background"></div>
<div class="chat-wrapper">
  <h1>🍽️ Proyecto Queso</h1>
  <div class="chat-container">
    <div id="messages"></div>
    <form id="inputForm">
      <input type="text" id="userInput" placeholder="Escribe tu pregunta..." required />
      <button type="submit">Enviar</button>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById('inputForm');
  const input = document.getElementById('userInput');
  const messages = document.getElementById('messages');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const userMsg = input.value;
    appendMessage('user', userMsg);
    input.value = '';

    const res = await fetch('https://proyecto-queso-backend.onrender.com/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userMsg })
    });

    const data = await res.json();
    if (data.status === 'ok') {
      appendMessage('bot', data.reply);
    } else {
      appendMessage('bot', data.message || 'Error desconocido.');
    }
  });

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'message';
    div.innerHTML = `<span class="${role}">${role === 'user' ? 'Tú' : 'Queso'}:</span> ${text}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }
</script>
</body>
</html>
